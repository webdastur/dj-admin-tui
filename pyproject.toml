[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI is `dj-admin-tui`; the import package is `dj_admin_tui`.
name = "dj-admin-tui"
version = "0.0.1"
description = "A terminal UI for the Django admin — browse, search, edit, and run admin actions from the terminal."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Abdulaminkhon Khaydarov", email = "webdasturuz@gmail.com" }]
keywords = ["django", "admin", "tui", "terminal", "textual", "console", "ssh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "django>=4.2,<7",
    "textual>=8.2,<9",
]

# Installable extras. Dev tooling lives in the PEP 735 `[dependency-groups]`
# below (used by `uv sync --dev` / CI); `docs` is a pip-installable extra so
# Read the Docs can build the site with `pip install .[docs]`.
[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/webdastur/dj-admin-tui"
Documentation = "https://dj-admin-tui.readthedocs.io"
Source = "https://github.com/webdastur/dj-admin-tui"
Issues = "https://github.com/webdastur/dj-admin-tui/issues"
Changelog = "https://github.com/webdastur/dj-admin-tui/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["dj_admin_tui"]
# Ship the bundled design-system stylesheet alongside the Python modules.
artifacts = ["dj_admin_tui/**/*.tcss"]

[tool.hatch.build.targets.sdist]
include = [
    "/dj_admin_tui",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
# sample_project/ and tests/ are intentionally excluded from the wheel and
# sdist — they are dev assets that stay in the repo only.

[dependency-groups]
# PEP 735 dev group. `uv sync --dev` and `uv sync --group dev` both install it.
dev = [
    "pytest>=9.0",
    "pytest-django>=4.12",
    "pytest-asyncio>=1.4",
    "pytest-timeout>=2.3",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["sample_project/*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "DJ",   # flake8-django
    "PT",   # flake8-pytest-style
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",     # line too long — formatter handles it
    # This is a TUI: source strings, comments, and docstrings intentionally
    # use typographic glyphs (› ‹ • ✔ ✘ × — …) and box-drawing characters.
    "RUF001",   # ambiguous character in a string
    "RUF002",   # ambiguous character in a docstring
    "RUF003",   # ambiguous character in a comment
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "B018",     # tests can have useless expressions
    "RUF012",   # test stand-in overlay classes use mutable class attrs as fixtures
]
# The sample project is idiomatic Django app code: Model / ModelForm / ModelAdmin
# classes use bare mutable class attributes (list_display, actions, fieldsets,
# Meta options) by convention, so RUF012 and DJ007 are false positives here.
"sample_project/**/*.py" = ["RUF012", "DJ007"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sample_project.sample_project.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
